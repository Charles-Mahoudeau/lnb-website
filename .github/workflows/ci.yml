name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The `db` tests run services against a real PostgreSQL, in a database of their own.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lnb
          POSTGRES_PASSWORD: lnb
          POSTGRES_DB: lnb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lnb -d lnb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgres://lnb:lnb@localhost:5432/lnb
      - run: pnpm build
      - run: pnpm audit --prod

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI image needs no license key, unlike gitleaks-action on organization repos.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
