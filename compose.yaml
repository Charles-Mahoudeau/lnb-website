# Local development services. Start with `docker compose up -d`.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lnb
      POSTGRES_PASSWORD: lnb
      POSTGRES_DB: lnb
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lnb -d lnb']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
