allowBuilds:
  # Uses the prebuilt libvips binaries from @img/sharp-*, so it needs no install script.
  sharp: false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

# Security overrides for transitive dependencies. Drop each one once upstream ships the fix.
overrides:
  # @nuxt/fonts (via fontless) still pulls esbuild 0.27 (GHSA-g7r4-m6w7-qqqr).
  'esbuild@<0.28.1': ^0.28.2
  # @scalar/api-reference (dev, for /api/docs) pulls ai 6.0.33, which @nuxt/ui then counts as its
  # optional peer, so it shows in the production tree (GHSA-866g-f22w-33x8).
  '@ai-sdk/provider-utils@<4.0.33': ^4.0.33
  # undici 8 via nuxt and unifont (GHSA-4qv8-2p9j-2685 and others), undici 6 via @ai-sdk/provider-utils.
  'undici@>=8 <8.12.2': ^8.12.2
  'undici@<6.29.1': ^6.29.1
  # nitropack's @rollup/plugin-terser (GHSA-m5mm-p8h7-m29v).
  'serialize-javascript@<7.1.3': ^7.1.3

auditConfig:
  # None of these reach the production server. Re-check them when Renovate bumps Nuxt.
  ignoreGhsas:
    # node-forge (no fix yet), via listhen: dev server HTTPS only.
    - GHSA-86w9-cpqp-85rv
    # braces (no fix yet), via globby: build time, with our own patterns only.
    - GHSA-vfj7-8cjw-p6xm
    # simple-git 3, via @nuxt/devtools: local dev only. Overriding to simple-git 4 breaks devtools.
    - GHSA-v5rq-49vh-5v5c
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
